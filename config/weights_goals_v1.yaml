# goals_v2 — prefer DataGaffer Dixon–Coles / percents prior; homemade Poisson is fallback
version: goals_v2

# Multiplicative ratio model (fallback only when sim matrix/percents missing):
#   lam_home = (home_att / L) * (away_def / L) * L * home_adv * coef_scale
home_advantage: 1.08
default_league_avg: 1.35
xg_blend_weight: 0.25          # blend xgf/xga when both sides have non-zero xG
max_goals: 8
fh_goal_share: 0.42            # share of full-time lambda assigned to first half
min_lambda: 0.15
max_lambda: 4.5
# Homemade DC only when DG matrix absent; live path prefers sim correct_score.matrix
dixon_coles_enabled: true
dixon_coles_rho: -0.05
prefer_sim_prior: true
