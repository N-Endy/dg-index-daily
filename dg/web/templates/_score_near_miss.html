{% if p.awaiting_score and p.score_hint_candidates %}
<button type="button"
        class="dg-score-near-miss"
        title="Possible Flashscore score — click to review"
        data-fixture-id="{{ p.fixture_id }}"
        data-home="{{ p.home_name }}"
        data-away="{{ p.away_name }}"
        data-candidates='{{ p.score_hint_candidates | tojson }}'>!</button>
{% endif %}
{% if p.awaiting_score and score_link_unlocked %}
<button type="button"
        class="dg-score-manual"
        title="Enter final score manually"
        data-fixture-id="{{ p.fixture_id }}"
        data-home="{{ p.home_name }}"
        data-away="{{ p.away_name }}">FT</button>
{% endif %}
