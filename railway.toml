# Railway: single web service with volume at /data.
# Daily ingest runs inside the same container (deploy/start.sh) — Railway
# cannot share one volume across two services.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh /app/deploy/start.sh"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
