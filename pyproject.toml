[project]
name = "datagaffer-daily"
version = "0.1.0"
description = "Daily DG Index ingest, fixtures, and rule-based predictions"
requires-python = ">=3.9"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".agent", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
exclude = ["(?x)(\\.agent/|\\.venv/|tests/)"]
check_untyped_defs = false
warn_return_any = false

